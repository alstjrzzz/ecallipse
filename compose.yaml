services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ecallipse
      POSTGRES_USER: ecallipse
      POSTGRES_PASSWORD: ecallipse
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  freeswitch:
    build:
      context: ./infra/freeswitch
    image: ecallipse-freeswitch:1.10.12
    hostname: ecallipse-freeswitch
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "5066:5066/tcp"
      - "7443:7443/tcp"
      - "16384-16484:16384-16484/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "fs_cli", "-x", "status"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
