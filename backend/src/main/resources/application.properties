spring.application.name=ecallipse
server.address=127.0.0.1
# Root .env holds local secrets such as DEEPGRAM_API_KEY. bootRun and tests run from backend/.
spring.config.import=optional:file:../.env[.properties]
ecallipse.stt.deepgram.api-key=${DEEPGRAM_API_KEY:}
ecallipse.stt.deepgram.model=nova-2
ecallipse.stt.language=ko
